<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Liste de Courses</title>
<link href="designe.css" rel="stylesheet">
<style>

</style>
</head>
<body>

<header>
  <h1>🛒 Mes Courses by Ivan</h1>
  <span id="cat-count">0 articles</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('catalogue')">📦 Catalogue</button>
  <button class="tab" onclick="switchTab('courses')">🛒 Ma Liste</button>
  <button class="tab" onclick="switchTab('commercant')">🧾 Commerçant</button>
</div>

<!-- ===== CATALOGUE ===== -->
<div class="panel active" id="panel-catalogue">
  <div class="cat-form">
    <input id="cat-name" type="text" placeholder="Nom de l'article" maxlength="60" />
    <input id="cat-price" type="number" step="0.01" min="0" placeholder="Prix (CFA)" style="width:100px;flex:none" />
    <div class="type-toggle" id="cat-type-toggle" role="radiogroup" aria-label="Type de prix">
      <button type="button" class="type-btn sel" role="radio" aria-checked="true" data-type="achat" onclick="selCatType(this,'achat')">Achat</button>
      <button type="button" class="type-btn" role="radio" aria-checked="false" data-type="vente" onclick="selCatType(this,'vente')">Vente</button>
    </div>
    <div class="unit-toggle" style="margin:0;gap:5px">
      <button class="unit-btn sel" onclick="selUnit(this,'Carton')">Carton</button>
      <button class="unit-btn sel" onclick="selUnit(this,'Demi')">1/2</button>
      <button class="unit-btn sel" onclick="selUnit(this,'cart')">1/4</button>
    </div>
    <button class="btn-add" onclick="addCatItem()">+ Ajouter</button>
  </div>
  <div class="cat-list" id="cat-list">
    <div class="empty-state"><div class="empty-icon">📋</div>Ton catalogue est vide.<br>Ajoute tes articles habituels ici.</div>
  </div>
</div>

<!-- ===== COURSES ===== -->
<div class="panel" id="panel-courses">
  <div class="search-wrap">
    <input id="shop-search" type="text" placeholder="🔍 Commence à écrire un article…" autocomplete="off" oninput="onSearch()" onkeydown="onSearchKey(event)" />
    <div class="dropdown" id="dropdown" style="display:none"></div>
  </div>

  <div class="qty-row">
    <input id="shop-qty" type="number" min="0.01" step="0.01" placeholder="Qté" value="1" />
    <div class="selected-preview" id="preview">← Choisis un article</div>
    <button class="btn-add" onclick="addToList()">Ajouter</button>
  </div>

  <div class="shop-list" id="shop-list"></div>

  <div class="total-bar">
    <div>
      <div class="total-label">Total estimé</div>
      <div class="total-count" id="total-count">0 article</div>
    </div>
    <div class="total-amount" id="total-amount">0 CFA</div>
  </div>
  <button class="btn-clear" onclick="clearList()">🗑 Vider la liste</button>
</div>

<!-- ===== COMMERÇANT ===== -->
<div class="panel" id="panel-commercant">
  <div class="search-wrap">
    <input id="merch-search" type="text" placeholder="🔍 Commence à écrire un article…" autocomplete="off" oninput="onMerchSearch()" onkeydown="onMerchSearchKey(event)" />
    <div class="dropdown" id="merch-dropdown" style="display:none"></div>
  </div>

  <div class="qty-row">
    <input id="merch-qty" type="number" min="0.01" step="0.01" placeholder="Qté" value="1" />
    <div class="selected-preview" id="merch-preview">← Choisis un article</div>
    <button class="btn-add" onclick="addToSale()">Ajouter</button>
  </div>

  <div class="shop-list" id="merch-list"></div>

  <div class="total-bar">
    <div>
      <div class="total-label">Total à payer</div>
      <div class="total-count" id="merch-count">0 article</div>
    </div>
    <div class="total-amount" id="merch-total">0 CFA</div>
  </div>

  <div class="cash-box" id="cash-box">
    <div class="cash-row">
      <label for="cash-received">Somme donnée par le client (CFA)</label>
      <input id="cash-received" type="number" min="0" step="1" placeholder="Ex: 5000" oninput="updateChange()" />
    </div>
    <div class="change-line" id="change-line">Saisis le total et la somme reçue</div>
  </div>

  <button class="btn-add" style="width:100%;margin-top:12px" onclick="validateSale()">✔ Valider la vente & Facture</button>
  <button class="btn-clear" onclick="clearSale()">🗑 Annuler la vente en cours</button>
</div>

<!-- ===== MODAL FACTURE ===== -->
<div class="modal-overlay" id="invoice-overlay">
  <div class="modal" style="max-width:400px" onclick="event.stopPropagation()">
    <h3>🧾 Facture <span id="invoice-number"></span></h3>
    <div id="invoice-content" class="invoice-content"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeInvoice()">Fermer</button>
      <button class="btn-save" onclick="printInvoice()">🖨 Imprimer</button>
    </div>
  </div>
</div>

<!-- ===== MODAL EDIT ===== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" onclick="event.stopPropagation()">
    <h3> Modifier l'article</h3>
    <input id="edit-name" type="text" placeholder="Nom de l'article" maxlength="60" />
    <input id="edit-price" type="number" step="1" min="0" placeholder="Prix (CFA)" oninput="onEditPriceInput()" />
    <div class="type-toggle" id="edit-type-toggle" role="radiogroup" aria-label="Type de prix" style="margin-bottom:8px">
      <button type="button" class="type-btn sel" role="radio" aria-checked="true" data-type="achat" onclick="selEditType(this,'achat')">Achat</button>
      <button type="button" class="type-btn" role="radio" aria-checked="false" data-type="vente" onclick="selEditType(this,'vente')">Vente</button>
    </div>
    <div class="edit-hint" id="edit-hint"></div>
    <div class="unit-toggle" id="edit-unit-toggle" style="margin-bottom:14px">
      <button class="unit-btn" onclick="selEditUnit(this,'Carton')">Carton</button>
      <button class="unit-btn" onclick="selEditUnit(this,'Demi')">1/2</button>
      <button class="unit-btn" onclick="selEditUnit(this,'unité')">unité</button>
      
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveEdit()">✔ Enregistrer</button>
    </div>
  </div>
</div>

<script src="scripte.js"></script>

<style>
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
</style>

</body>
</html>
